packages:
  - "apps/*"
  - "packages/*"

# Permite scripts de postinstall de dependencias necesarias (p. ej. esbuild de Vite).
onlyBuiltDependencies:
  - esbuild

# Versiones centralizadas para el toolchain compartido.
catalog:
  typescript: ~5.9.3
  "@types/node": ^24.0.0
  "@types/bun": ^1.3.14
  prettier: ^3.9.6
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  zod: ^4.4.3
